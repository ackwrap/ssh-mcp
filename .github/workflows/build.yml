name: Build installers

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: ${{ matrix.platform }} installer
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-amd64
          - os: macos-latest
            platform: macos-universal
          - os: ubuntu-latest
            platform: linux-amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify dependencies and source
        shell: bash
        run: |
          set -euo pipefail
          go mod verify
          go vet ./...
      - name: Check version and release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          output=$(go run . --version)
          version=${output#ssh-mcp }
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid application version: $output" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match application version v$version" >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          .\build.ps1
          $source = "dist/installer/SSH-MCP-Setup-$env:APP_VERSION.exe"
          $target = "dist/installer/SSH-MCP-Setup-$env:APP_VERSION-windows-amd64.exe"
          Move-Item -LiteralPath $source -Destination $target
      - name: Build macOS or Linux installer
        if: runner.os != 'Windows'
        shell: bash
        run: bash ./build.sh
      - name: Verify Linux package installation
        if: runner.os == 'Linux'
        shell: bash
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          sudo dpkg -i dist/installer/*.deb
          test "$(/usr/bin/ssh-mcp --version)" = "ssh-mcp $APP_VERSION"
      - name: Verify macOS package installation
        if: runner.os == 'macOS'
        shell: bash
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          lipo -verify_arch x86_64 arm64 dist/ssh-mcp
          codesign --verify --strict dist/ssh-mcp
          sudo installer -pkg dist/installer/*.pkg -target /
          test "$(/usr/local/bin/ssh-mcp --version)" = "ssh-mcp $APP_VERSION"
      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-${{ matrix.platform }}
          path: dist/installer/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installer-*
          path: release
          merge-multiple: true
      - name: Publish installers and checksums
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd release
          sha256sum ./*.exe ./*.pkg ./*.deb > SHA256SUMS.txt
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" ./* --clobber
          else
            gh release create "$RELEASE_TAG" ./* --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
